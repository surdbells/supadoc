<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>patient</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://testloop-bugreports-cdn.vercel.app/w.js" data-project="tl_pk_65b22a3f2e74d5b13b63635eaf956e86" async></script>
    <!-- Apply the saved (or system) theme before first paint — no flash of light. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('videomed.theme');
          var dark =
            saved === 'dark' ||
            (saved === null &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          /* storage blocked — default to light */
        }
      })();
    </script>
  </head>
  <body>
    <pat-root></pat-root>
  </body>
</html>
